baseURL = "https://thespacecoaststories.com/"
locale = "en-us"
title = "Space Coast Stories"
defaultContentLanguage = "en"
enableRobotsTXT = true
enableEmoji = true

# Blog posts dated in the future stay hidden until their date arrives.
buildFuture = false
summaryLength = 40

[params]
  description = "Space Coast-based personal historian creating legacy books and family memoirs for families nationwide through in-person, phone, and video interviews."
  # These fall back to data/site.yaml values in templates; kept here for quick reference.

[markup]
  [markup.goldmark.renderer]
    unsafe = true          # allow raw HTML in markdown (needed for some blog embeds)
  [markup.highlight]
    noClasses = false
    style = "friendly"

[taxonomies]
  category = "categories"
  series = "series"

